<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberShield - Fraud Simulation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .title {
            text-align: center;
        }

        .simulation {
            background: #fff3cd;
            border: 1px solid #ffe69c;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
        }

        .phone {
            background: #222;
            padding: 20px;
            border-radius: 25px;
            max-width: 350px;
            margin: auto;
        }

        .screen {
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        .message {
            background: #e9ecef;
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .sender {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .danger {
            color: #b00020;
            font-weight: bold;
        }

        .button {
            display: block;
            text-align: center;
            background: #d32f2f;
            color: white;
            padding: 12px;
            margin-top: 15px;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #a92323;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 class="title">CyberShield</h1>

    <div class="simulation">
        ⚠️ EDUCATIONAL SIMULATION
        <br>
        This is a fictional fraud demonstration.
    </div>

    <div class="phone">

        <div class="screen">

            <h2>Messages</h2>

            <div class="message">

                <div class="sender">
                    BANK-ALERT
                </div>

                <p class="danger">
                    ⚠️ Urgent Account Notification
                </p>

                <p>
                    Your account requires immediate verification.
                </p>

                <p>
                    Failure to verify may result in temporary
                    account suspension.
                </p>

                <a href="/phishing" class="button">
                    Verify Now
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
